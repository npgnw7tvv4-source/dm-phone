<script>
// 아래 두 설정에서 자동 답장과 통화 대사를 자유롭게 바꿀 수 있습니다.
const REPLIES=[{keys:['안녕'],text:'어, 왔냐? 반갑다.'},{keys:['뭐해','뭐 해'],text:'연습 끝나고 쉬는 중이야.'},{keys:['보고싶어','보고 싶어'],text:'나도. 조금만 기다려.'},{keys:['사랑해'],text:'갑자기 그런 말을… 나도.'}];
const CALL_LINES=['여보세요? 나야.','무슨 일이야?','…그냥 목소리 듣고 싶어서?','그래. 잠깐 얘기하자.'];
const $=id=>document.getElementById(id);let pin='',locked=true,dial='',timers=[],messages={k:[],m:[]};try{const old=JSON.parse(localStorage.getItem('daeman-demo'));if(old&&Array.isArray(old.k)&&Array.isArray(old.m))messages=old}catch(e){}
function save(){try{localStorage.setItem('daeman-demo',JSON.stringify(messages))}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('active',el.id===id));$('phone').classList.toggle('wall',['lock','home'].includes(id));document.querySelector('header').style.color=['lock','home','pin','call'].includes(id)?'white':'#111';if(id==='kchat')render('k');if(id==='mchat')render('m')}
function tick(){const d=new Date(),t=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});$('clock').textContent=t;$('statusTime').textContent=t;$('date').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}tick();setInterval(tick,1000);
function drawPin(){$('dots').textContent='●'.repeat(pin.length)+'○'.repeat(4-pin.length)}
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(v=>{const b=document.createElement('button');b.textContent=v;if(!v)b.style.visibility='hidden';b.onclick=()=>{if(v==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=v;drawPin();if(pin.length===4){if(pin==='0522'){locked=false;pin='';drawPin();$('hint').textContent='';show('home')}else{$('hint').textContent='암호가 맞지 않습니다.';pin='';drawPin()}}};$('pinkeys').append(b)});
function render(app){const el=$(app+'history');el.replaceChildren();messages[app].forEach(m=>{const b=document.createElement('div');b.className='bubble'+(m.me?' me':'');b.textContent=m.text;el.append(b)});el.scrollTop=el.scrollHeight}
const queues={k:Promise.resolve(),m:Promise.resolve()};document.querySelectorAll('form').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const input=form.querySelector('input'),text=input.value.trim(),app=form.dataset.app;if(!text)return;input.value='';messages[app].push({me:true,text});save();render(app);const key=text.replace(/\s/g,''),rule=REPLIES.find(r=>r.keys.some(k=>key.includes(k.replace(/\s/g,''))));const answer=rule?rule.text:'[아직 이 말에 대한 답장이 설정되지 않았어요.]';queues[app]=queues[app].then(()=>new Promise(resolve=>setTimeout(()=>{messages[app].push({me:false,text:answer});save();render(app);resolve()},1200)))}));
function drawDial(){$('number').textContent=dial}['1','2','3','4','5','6','7','8','9','*','0','#'].forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(dial.length<16)dial+=v;drawDial()};$('dialkeys').append(b)});
function startCall(){timers.forEach(clearTimeout);timers=[];show('call');$('callstate').textContent='연결 중…';$('line').textContent='';timers.push(setTimeout(()=>{$('callstate').textContent='통화 중 · 가상 통화'},1600));CALL_LINES.forEach((line,i)=>timers.push(setTimeout(()=>{$('line').textContent=line},2200+i*3300)));timers.push(setTimeout(()=>{$('callstate').textContent='대사가 끝났습니다'},2200+CALL_LINES.length*3300))}
function endCall(){timers.forEach(clearTimeout);timers=[];show('dial')}
let startY=0;$('lock').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});$('lock').addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>45)show('pin')},{passive:true});
</script></html>
